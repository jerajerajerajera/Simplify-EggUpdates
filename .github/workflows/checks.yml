name: Checks
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  # A change to text only (docs, Markdown) skips the panel: tests and pint still run, so the check stays green.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="origin/${{ github.base_ref }}" ;;
            push) base="${{ github.event.before }}" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          files=$(git diff --name-only "$base" HEAD 2>/dev/null) || files=unknown
          printf 'Changed:\n%s\n' "$files"
          if printf '%s\n' "$files" | grep -qvE '^(docs/|LICENSE|.*\.md$)'; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "::notice::Text only: the panel smoke is skipped"; fi
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: bash tests/run.sh
      - run: bash tests/docs-sync.sh
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: pint
      - run: pint --test -v
  # Installs the plugin in a real Pelican panel and opens its pages, so an error that only shows when the panel loads the code blocks the merge.
  panel-smoke:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pelican: '1.0.0-beta38'
            php: '8.3'
          - pelican: '1.0.0-rc.2'
            php: '8.4'
          # With the real Simplify core (main), not a stub: the add-on opens inside Simplify (P-1).
          - pelican: '1.0.0-rc.2'
            php: '8.4'
            simplify: 'main'
    name: panel-smoke (Pelican ${{ matrix.pelican }}${{ matrix.simplify && format(', Simplify {0}', matrix.simplify) || '' }})
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, gd, intl, mbstring, pdo_sqlite, sqlite3, zip
          tools: composer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g yarn
      - name: Install Pelican ${{ matrix.pelican }}
        run: |
          git clone --quiet --depth 1 --branch "v${{ matrix.pelican }}" https://github.com/pelican-dev/panel.git panel
          cd panel
          composer install --no-interaction --no-progress --prefer-dist
          sed -i "s/'version' => 'canary'/'version' => '${{ matrix.pelican }}'/" config/app.php
          cp .env.example .env
          sed -i 's/^APP_INSTALLED=.*/APP_INSTALLED=true/; s/^APP_DEBUG=.*/APP_DEBUG=true/; s#^APP_URL=.*#APP_URL=http://localhost#' .env
          printf 'DB_CONNECTION=sqlite\nQUEUE_CONNECTION=database\nCACHE_STORE=file\nSESSION_DRIVER=file\nMAIL_MAILER=log\n' >> .env
          touch database/database.sqlite
          php artisan key:generate --force
          php artisan migrate --force
          yarn install --silent
      # Until 1.1.0 the plugin id was simplify-egg-updates: install that version first, so the job proves the new id
      # takes over its settings and removes the old folder.
      - name: Install Simplify ${{ matrix.simplify }}
        if: matrix.simplify
        run: |
          git clone --quiet --depth 1 --branch "${{ matrix.simplify }}" https://github.com/jerajerajerajera/simplify.git panel/plugins/simplify
          rm -rf panel/plugins/simplify/.git
          cd panel
          php artisan p:plugin:install simplify
          php artisan p:plugin:list | grep -E '\| Simplify .*\| enabled' || { echo 'Simplify did not install'; exit 1; }
      - name: Install the old simplify-egg-updates 1.0.3
        run: |
          git clone --quiet --depth 1 --branch v1.0.3 "https://github.com/${{ github.repository }}.git" panel/plugins/simplify-egg-updates
          rm -rf panel/plugins/simplify-egg-updates/.git
          cd panel
          php artisan p:plugin:install simplify-egg-updates
          php -r '$db = new PDO("sqlite:database/database.sqlite"); $db->exec("INSERT INTO simplify_egg_update_settings (key, value) VALUES (\"ci_takeover\", \"kept\")");'
      - name: Install Simplify Egg Updates
        run: |
          mkdir -p panel/plugins/simplify-eggupdates
          tar -C plugin --exclude=.git --exclude=dist -cf - . | tar -C panel/plugins/simplify-eggupdates -xf -
          cd panel
          # As Admin → Plugins and the Hub install it: in a queue job.
          php artisan tinker --execute="App\Jobs\Plugin\InstallPlugin::dispatch(App\Models\User::factory()->create(), 'simplify-eggupdates');"
          php artisan queue:work --max-jobs=1 --stop-when-empty
          php artisan p:plugin:list | tee plugins.txt
          grep -E 'Simplify Egg Updates .*\| enabled' plugins.txt || { echo 'Simplify Egg Updates did not install'; exit 1; }
          test ! -e plugins/simplify-egg-updates || { echo 'The old simplify-egg-updates folder is still there'; exit 1; }
          test "$(grep -c 'Simplify Egg Updates' plugins.txt)" = 1 || { echo 'Simplify Egg Updates is listed twice'; exit 1; }
          php -r '$db = new PDO("sqlite:database/database.sqlite"); $kept = $db->query("SELECT value FROM simplify_egg_update_settings WHERE key = \"ci_takeover\"")->fetchColumn(); $db->exec("DELETE FROM simplify_egg_update_settings WHERE key = \"ci_takeover\""); exit($kept === "kept" ? 0 : 1);' || { echo 'The old settings were lost'; exit 1; }
      # Every public egg, at a fixed commit so a change upstream never turns a pull request red by itself.
      - name: Get the public eggs
        run: |
          while read -r repo sha; do
            git init --quiet "public-eggs/$repo"
            git -C "public-eggs/$repo" fetch --quiet --depth 1 "https://github.com/pelican-eggs/$repo.git" "$sha"
            git -C "public-eggs/$repo" checkout --quiet FETCH_HEAD
          done <<'EOF'
          chatbots 7019bbaf35883b27c52532bc29bc1f090659a074
          database efd5983aa52aa0446c11bc6d8f696f788cdfc8e7
          games-standalone e1b52607397c0de9d6918d0659f1ff95721d3b49
          games-steamcmd 388329b516753e8217a9c7a09b342a0626ac56b4
          generic eec3d4b153ccb8b901905b486f29d4d199154f5b
          minecraft c6f2262eb351054d1be44d3f6a3a605ae163d682
          monitoring 3ebb141a8dd7d3eccb4aebf9aaee7f749a3d4529
          software adc324f7f23fad7a57644fd4595411501fda0f39
          voice b25c93abbacbfc8162a4035d2944995d47288444
          EOF
      - name: PHPStan (level 5, in the panel)
        working-directory: panel
        run: |
          composer require --dev larastan/larastan --no-interaction --no-progress --quiet
          vendor/bin/phpstan analyse --configuration plugins/simplify-eggupdates/phpstan.neon --memory-limit 1G --no-progress --error-format=github
      - name: Open the pages
        working-directory: panel
        env:
          PUBLIC_EGGS: ${{ github.workspace }}/public-eggs
        run: |
          php plugins/simplify-eggupdates/tests/panel/smoke.php | tee smoke.txt
          grep -q '^All steps passed$' smoke.txt
      - name: Laravel log
        if: failure()
        run: grep -h -E '^\[[0-9-]+ [0-9:]+\]' panel/storage/logs/*.log | cut -c1-600 | tail -n 12 || true
