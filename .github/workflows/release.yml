name: Release
# A new version in plugin.json on main (not a -dev version) becomes GitHub Release v<version> with its zip, for upload to the Pelican Hub.
# The panel never reads this release: updates come from the Hub only.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugin.json'))['version'])")
          case "$version" in *-dev*) echo "Version $version is still in development."; exit 0;; esac
          if gh release view "v$version" >/dev/null 2>&1; then echo "Release v$version already exists."; exit 0; fi
          zip=$(python3 scripts/build-package.py)
          # A version with a dash (2.0.0-beta.1) is a prerelease: never marked as the latest release.
          case "$version" in *-*) kind=--prerelease;; *) kind=--latest;; esac
          awk -v head="## $version" 'index($0, head) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          gh release create "v$version" "$zip" --target "$GITHUB_SHA" --title "Simplify Egg Updates $version" --notes-file notes.md "$kind"
          echo "created=1" >> "$GITHUB_OUTPUT"
      # A beta goes to the Hub's beta channel by itself (V63). Never "submit": that sends it to stable review.
      # A Hub timeout is a warning, not a red run: run the workflow by hand later to sync the current version's tag again.
      - name: Publish the beta on the Hub
        if: always() && (steps.release.outputs.created == '1' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          HUB_API_KEY: ${{ secrets.HUB_API_KEY }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('plugin.json'))['version'])")
          slug=$(python3 -c "import json; print(json.load(open('plugin.json'))['id'])")
          case "$version" in *-beta*) ;; *) echo "Version $version is not a beta: submit stable versions on the Hub yourself."; exit 0;; esac
          if [ -z "$HUB_API_KEY" ]; then echo "::warning::No HUB_API_KEY secret: sync $version on the Hub yourself."; exit 0; fi
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/v$version" --jq .sha)
          for try in 1 2 3; do
            rm -f hub.json
            code=$(curl -sS -o hub.json -w '%{http_code}' -X POST "https://hub.pelican.dev/api/plugins/$slug/versions/sync" \
              -H "Authorization: Bearer $HUB_API_KEY" -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -d "{\"commit\":\"$commit\",\"channel\":\"beta\"}") || code=${code:-000}
            echo "Hub sync of $slug $version ($commit), try $try: HTTP $code $(python3 -c "import json; d=json.load(open('hub.json')); d=d.get('data', d); print(' '.join(str(d.get(k)) for k in ('code', 'message', 'id', 'version', 'status', 'channel', 'published_to_channel_at') if d.get(k)))" 2>/dev/null)"
            case "$code" in 200|201) exit 0;; 5*|000) sleep 60;; *) exit 1;; esac
          done
          echo "::warning::The Hub did not answer: run this workflow by hand later to sync $version."
